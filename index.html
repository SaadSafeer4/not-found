<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- script-src: same-origin files (config.js) plus the one inline script below, pinned by hash.
     If you edit that script, recompute the hash (see README). connect-src: your Supabase host. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'sha256-7Wxhp0pnaAWZVYcebDi7tChfgqKHL5KmYGjA/HOhvU0='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src https://snanbuelykowkbiwolkr.supabase.co; base-uri 'none'; form-action 'none'">
<title>Not Found</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F0E8;
    --fg: #14161A;
    --accent: #2A3BDB;
    --muted: #5B5F66;
    --line: rgba(20, 22, 26, 0.2);
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --serif: "EB Garamond", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 400 20px/1.5 var(--serif);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 64px; }

  /* address bar */
  .bar {
    display: flex; align-items: center; gap: 0;
    min-width: 0;
    padding: 9px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.45);
    font: 400 14px/1.3 var(--mono);
    white-space: nowrap;
  }
  .bar a { color: var(--muted); text-decoration: none; flex: none; }
  .bar a:hover { color: var(--accent); }
  .bar .path { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

  main { padding-top: 40px; }
  h1 { margin: 0 0 16px; font-weight: 500; line-height: 1.15; }
  h1.title { font-size: 2.4rem; }
  h1.addr {
    font: 500 clamp(1.5rem, 7vw, 2.4rem)/1.2 var(--mono);
    overflow-wrap: anywhere;
  }
  h2 { margin: 0 0 12px; font-weight: 500; font-size: 1.5rem; line-height: 1.2; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); }
  .small { font: 400 13px/1.4 var(--mono); color: var(--muted); }

  .field-label { display: block; margin-bottom: 8px; font: 500 13px/1.4 var(--mono); color: var(--muted); }
  input[type="text"], textarea {
    display: block; width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.6);
    color: var(--fg);
    font: 400 18px/1.5 var(--serif);
  }
  input[type="text"] { font-size: 18px; }
  textarea { min-height: 150px; resize: vertical; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .row { display: flex; gap: 8px; align-items: stretch; }
  .row input { flex: 1; min-width: 0; }
  .meta { display: flex; justify-content: space-between; gap: 12px; margin: 8px 0 20px; }
  .counter.full { color: var(--accent); }

  button {
    min-height: 46px;
    padding: 0 20px;
    border: 1px solid var(--accent);
    border-radius: 8px;
    background: var(--accent);
    color: var(--bg);
    font: 500 14px/1 var(--mono);
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }

  .body-text {
    margin: 8px 0 24px;
    font-size: 1.5rem; line-height: 1.45;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .preview {
    margin: 0 0 24px; padding: 4px 0 4px 16px;
    border-left: 3px solid var(--accent);
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .notice { margin: 0 0 24px; padding: 10px 14px; border-left: 3px solid var(--accent); font-family: var(--mono); font-size: 14px; }
  ul.terms { margin: 0 0 24px; padding-left: 20px; }
  ul.terms li { margin-bottom: 4px; }
  .hint { min-height: 1.4em; margin: 8px 0 0; }

  @media (min-width: 600px) {
    .wrap { padding-top: 32px; }
    main { padding-top: 64px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar"></div>
  <main id="app"></main>
</div>

<script src="/config.js"></script>
<script>
(() => {
  'use strict';

  const CFG = window.NOT_FOUND_CONFIG || {};
  const MAX_SLUG = 100;
  const MAX_BODY = 280;
  const TIMEOUT_MS = 15000;

  const app = document.getElementById('app');
  const bar = document.getElementById('bar');

  // ---------- slug ----------

  function normalizeSlug(raw) {
    let s = String(raw);
    try { s = decodeURIComponent(s); } catch (e) { /* keep raw */ }
    s = s.replace(/^\/+|\/+$/g, '');
    s = s.normalize('NFKC').toLowerCase();
    s = s.replace(/[^\p{L}\p{N}]+/gu, '-');
    s = s.replace(/^-+|-+$/g, '');
    s = [...s].slice(0, MAX_SLUG).join('');
    // Truncating can expose a trailing hyphen; trim again so normalizeSlug is idempotent.
    s = s.replace(/-+$/, '');
    return s;
  }

  function safeDecode(s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }

  const cpLength = (text) => [...text].length;

  // ---------- DOM helpers (user text only ever goes through text nodes) ----------

  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {
      if (k === 'class') el.className = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v);
    }
    el.append(...kids);
    return el;
  }

  function mount(...nodes) { app.replaceChildren(...nodes); }

  function setAddress(slug) {
    const host = h('a', { href: '/' }, location.host);
    host.addEventListener('click', (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
      e.preventDefault();
      navigate('');
    });
    bar.replaceChildren(host, h('span', { class: 'path' }, '/' + slug));
    document.title = slug ? '/' + slug + ' — Not Found' : 'Not Found';
  }

  // ---------- API (plain fetch against Supabase REST) ----------

  function configured() {
    return !!CFG.SUPABASE_URL && !!CFG.SUPABASE_ANON_KEY &&
      !/YOUR-PROJECT-REF|YOUR-ANON-KEY/.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY);
  }

  async function api(query, opts) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
    try {
      return await fetch(CFG.SUPABASE_URL + '/rest/v1/pages' + query, Object.assign({}, opts, {
        signal: ctrl.signal,
        credentials: 'omit',
        cache: 'no-store',
        headers: Object.assign({
          apikey: CFG.SUPABASE_ANON_KEY,
          Authorization: 'Bearer ' + CFG.SUPABASE_ANON_KEY,
        }, opts && opts.headers),
      }));
    } finally {
      clearTimeout(timer);
    }
  }

  // Resolves to a row, or null if the address is unclaimed. Throws on ANY failure,
  // so an unverified address is never treated as empty.
  async function lookup(slug) {
    const res = await api('?slug=eq.' + encodeURIComponent(slug) + '&select=slug,body,created_at',
      { headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('lookup failed: ' + res.status);
    const rows = await res.json();
    if (!Array.isArray(rows)) throw new Error('lookup failed: bad response');
    return rows[0] || null;
  }

  // Resolves to { row } on success or { taken: true } when the primary key rejected the insert.
  async function claim(slug, body) {
    const res = await api('', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Prefer: 'return=representation',
      },
      body: JSON.stringify({ slug, body }),
    });
    if (res.status === 201) {
      let rows = null;
      try { rows = await res.json(); } catch (e) { /* fall through to re-fetch */ }
      return { row: Array.isArray(rows) && rows[0] ? rows[0] : null };
    }
    let err = null;
    try { err = await res.json(); } catch (e) { /* no body */ }
    if (res.status === 409 || (err && err.code === '23505')) return { taken: true };
    throw new Error('claim failed: ' + res.status);
  }

  // ---------- state ----------

  let token = 0;               // bumped on every route(); stale async results are dropped
  let draft = { slug: '', text: '' };

  function navigate(slug) {
    const path = '/' + slug;
    if (safeDecode(location.pathname) !== path) history.pushState(null, '', path);
    route();
  }

  async function route() {
    const my = ++token;
    const slug = normalizeSlug(location.pathname);
    const canonical = '/' + slug;
    if (safeDecode(location.pathname) !== canonical) history.replaceState(null, '', canonical);
    setAddress(slug);

    if (!slug) return renderHome();
    if (!configured()) {
      return renderError('This site is not configured yet. Fill in config.js with your Supabase project URL and anon key.');
    }

    renderChecking();
    let row;
    try {
      row = await lookup(slug);
    } catch (e) {
      if (my === token) renderError('We could not check this address. Nothing has been claimed or changed.', route);
      return;
    }
    if (my !== token) return;
    if (row) renderTaken(row); else renderEmpty(slug);
  }

  // ---------- views ----------

  function renderHome() {
    const input = h('input', {
      type: 'text', id: 'try', autocomplete: 'off', autocapitalize: 'none',
      spellcheck: 'false', placeholder: 'the smell of wet cardboard at 5pm',
    });
    const hint = h('p', { class: 'small hint', role: 'status' });
    const form = h('form', { novalidate: '' },
      h('label', { class: 'field-label', for: 'try' }, 'Try an address'),
      h('div', { class: 'row' }, input, h('button', { type: 'submit' }, 'Go')),
      hint);
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const slug = normalizeSlug(input.value);
      if (!slug) { hint.textContent = 'Use at least one letter or number.'; return; }
      navigate(slug);
    });
    mount(
      h('h1', { class: 'title' }, 'Not Found'),
      h('p', {}, 'Every address on this site is a page that can be claimed exactly once. If nobody has claimed an address, you can write up to 280 characters there, and from then on it is permanent: anyone who visits that address sees your words.'),
      h('p', { class: 'muted' }, 'Type an address below, or just change the URL.'),
      form);
  }

  function renderChecking() {
    mount(h('p', { class: 'muted', role: 'status' }, 'looking…'));
  }

  function renderError(message, retry) {
    const kids = [
      h('h2', {}, 'Something went wrong'),
      h('p', { role: 'alert' }, message),
    ];
    if (retry) kids.push(h('div', { class: 'actions' }, h('button', { type: 'button', onclick: retry }, 'Try again')));
    mount(...kids);
  }

  function renderTaken(row, notice) {
    const when = new Date(row.created_at);
    const kids = [];
    if (notice) kids.push(h('p', { class: 'notice', role: 'status' }, notice));
    kids.push(
      h('h1', { class: 'addr' }, '/' + row.slug),
      h('p', { class: 'body-text' }, row.body),
      h('p', { class: 'small' }, 'Claimed ',
        h('time', { datetime: row.created_at },
          isNaN(when) ? row.created_at : when.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }))));
    mount(...kids);
  }

  function renderEmpty(slug, notice) {
    const ta = h('textarea', {
      id: 'body', rows: '6', autocomplete: 'off', spellcheck: 'true',
      placeholder: 'Nobody has written anything here yet.',
    });
    ta.value = draft.slug === slug ? draft.text : '';
    const counter = h('span', { class: 'small counter' });
    const btn = h('button', { type: 'submit' }, 'Claim this address');

    function sync() {
      // maxlength counts UTF-16 units, so cap by code points instead.
      const cps = [...ta.value];
      if (cps.length > MAX_BODY) ta.value = cps.slice(0, MAX_BODY).join('');
      const n = cpLength(ta.value);
      counter.textContent = n + ' / ' + MAX_BODY;
      counter.classList.toggle('full', n >= MAX_BODY);
      btn.disabled = ta.value.trim() === '';
      draft = { slug, text: ta.value };
    }
    ta.addEventListener('input', sync);

    const form = h('form', { novalidate: '' },
      h('label', { class: 'field-label', for: 'body' }, 'This address is empty. Claim it.'),
      ta,
      h('div', { class: 'meta' }, counter, h('span', { class: 'small' }, 'plain text only')),
      btn);
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = ta.value.trim();
      if (!text || cpLength(text) > MAX_BODY) return;
      renderConfirm(slug, text);
    });

    const kids = [];
    if (notice) kids.push(h('p', { class: 'notice', role: 'status' }, notice));
    kids.push(h('h1', { class: 'addr' }, '/' + slug), form);
    mount(...kids);
    sync();
  }

  function renderConfirm(slug, text) {
    const my = token;
    const yes = h('button', { type: 'button' }, 'Claim it permanently');
    const back = h('button', { type: 'button', class: 'secondary' }, 'Go back');
    back.addEventListener('click', () => renderEmpty(slug));
    yes.addEventListener('click', async () => {
      yes.disabled = back.disabled = true;
      yes.textContent = 'Claiming…';
      let result;
      try {
        result = await claim(slug, text);
      } catch (e) {
        if (my === token) {
          renderError('We could not confirm your claim, so it may or may not have gone through. Try again to check this address; your text is kept if it is still empty.', route);
        }
        return;
      }
      if (my !== token) return;
      if (result.row) { draft = { slug: '', text: '' }; return renderTaken(result.row); }
      await settle(slug, result.taken ? 'Someone got here first' : '', my);
    });

    mount(
      h('h1', { class: 'addr' }, '/' + slug),
      h('h2', {}, 'Claim this address?'),
      h('p', { class: 'preview' }, text),
      h('ul', { class: 'terms' },
        h('li', {}, 'The claim is permanent.'),
        h('li', {}, 'It cannot be edited or deleted, by you or anyone else.'),
        h('li', {}, 'It is anonymous: there are no accounts, and the site never asks who you are.')),
      h('div', { class: 'actions' }, yes, back));
  }

  // Re-fetch an address and render whatever is really there.
  async function settle(slug, notice, my) {
    let row;
    try {
      row = await lookup(slug);
    } catch (e) {
      if (my === token) renderError((notice ? notice + '. ' : '') + 'We could not load the address afterwards.', route);
      return;
    }
    if (my !== token) return;
    if (row) renderTaken(row, notice); else renderEmpty(slug, notice);
  }

  window.addEventListener('popstate', route);
  route();
})();
</script>
</body>
</html>
